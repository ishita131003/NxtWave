<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>NxtWave Growth Hub (Prototype)</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #fff;
        --tx: #0f172a;
        --mu: #64748b;
        --pr: #4338ca;
        --nv: #1e1b4b;
        --bd: #e2e8f0;
        --ok: #15803d;
        --er: #b91c1c;
        --wn: #fef3c7;
        --wt: #78350f;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0f1e;
          --card: #151a2e;
          --tx: #e8ecf8;
          --mu: #94a3b8;
          --pr: #818cf8;
          --nv: #0b0f1e;
          --bd: #28304d;
          --ok: #4ade80;
          --er: #f87171;
          --wn: #3b2f0b;
          --wt: #fde68a;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0f1e;
        --card: #151a2e;
        --tx: #e8ecf8;
        --mu: #94a3b8;
        --pr: #818cf8;
        --nv: #0b0f1e;
        --bd: #28304d;
        --ok: #4ade80;
        --er: #f87171;
        --wn: #3b2f0b;
        --wt: #fde68a;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      a {
        color: var(--pr);
      }
      .mu {
        color: var(--mu);
      }
      h1,
      h2,
      h3 {
        margin: 0.2em 0 0.4em;
        line-height: 1.2;
      }
      .top {
        background: var(--nv);
        color: #fff;
        padding: 10px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .top b {
        font-size: 17px;
      }
      .top .sp {
        flex: 1;
      }
      .top button {
        color: #fff;
      }
      .demo {
        background: var(--wn);
        color: var(--wt);
        padding: 6px 16px;
        font-size: 13px;
        text-align: center;
        font-weight: 600;
      }
      button,
      .btn {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        padding: 8px 14px;
        border-radius: 8px;
        text-decoration: none;
        display: inline-block;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--pr);
        outline-offset: 1px;
      }
      .p {
        background: var(--pr);
        color: #fff;
        border-color: var(--pr);
      }
      .top button {
        background: transparent;
        border-color: #ffffff55;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .hero {
        background: linear-gradient(135deg, #1e1b4b, #4338ca);
        color: #fff;
        padding: 48px 20px;
        text-align: center;
      }
      .hero h1 {
        font-size: clamp(26px, 5vw, 42px);
      }
      .hero p {
        max-width: 640px;
        margin: 8px auto;
        opacity: 0.92;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 16px;
      }
      .grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 16px;
      }
      .kpi b {
        font-size: 26px;
        display: block;
      }
      .kpi span {
        color: var(--mu);
        font-size: 13px;
      }
      .lay {
        display: flex;
        min-height: calc(100vh - 80px);
      }
      .side {
        width: 210px;
        background: var(--card);
        border-right: 1px solid var(--bd);
        padding: 12px;
        flex-shrink: 0;
      }
      .side button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        margin-bottom: 2px;
      }
      .side button.on {
        background: var(--pr);
        color: #fff;
      }
      .main {
        flex: 1;
        padding: 18px;
        min-width: 0;
      }
      @media (max-width: 720px) {
        .lay {
          flex-direction: column;
        }
        .side {
          width: 100%;
          display: flex;
          overflow-x: auto;
          gap: 4px;
          border-right: 0;
          border-bottom: 1px solid var(--bd);
        }
        .side button {
          white-space: nowrap;
          width: auto;
        }
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 13px;
        margin: 10px 0 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--card);
        color: var(--tx);
      }
      input[type="checkbox"] {
        width: auto;
      }
      .row {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .msg {
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-weight: 600;
      }
      .msg.ok {
        background: #dcfce7;
        color: #14532d;
      }
      .msg.er {
        background: #fee2e2;
        color: #7f1d1d;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th,
      td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--bd);
        text-align: left;
        white-space: nowrap;
      }
      .bar {
        display: grid;
        grid-template-columns: 150px 1fr 34px;
        gap: 8px;
        align-items: center;
        margin: 5px 0;
        font-size: 13px;
      }
      .bt {
        background: var(--bd);
        border-radius: 6px;
        height: 14px;
      }
      .bt i {
        display: block;
        height: 14px;
        border-radius: 6px;
        background: var(--pr);
      }
      .tag {
        font-size: 11px;
        background: var(--wn);
        color: var(--wt);
        padding: 2px 7px;
        border-radius: 99px;
        font-weight: 700;
      }
      .pg {
        height: 12px;
        background: #ffffff33;
        border-radius: 99px;
        max-width: 420px;
        margin: 12px auto;
      }
      .pg i {
        display: block;
        height: 12px;
        border-radius: 99px;
        background: #a5b4fc;
      }
      details {
        border-bottom: 1px solid var(--bd);
        padding: 8px 0;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      :root:root {
        --bg: #060a1c;
        --card: #0e1430;
        --tx: #e9edff;
        --mu: #93a0cf;
        --pr: #7c6cff;
        --nv: #050818;
        --bd: #222c58;
        --ok: #a3e635;
        --er: #fb7185;
        --wn: #2a2108;
        --wt: #fcd34d;
        --cy: #22d3ee;
        color-scheme: dark;
      }
      body {
        background:
          radial-gradient(900px 500px at 85% -10%, #2a1f7a66, transparent),
          radial-gradient(700px 400px at -5% 10%, #0e749033, transparent),
          var(--bg);
        background-attachment: fixed;
      }
      .top {
        background: linear-gradient(180deg, #070b21f2, #050818e8);
        backdrop-filter: blur(18px) saturate(140%);
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        border-bottom: 1px solid #ffffff14;
        box-shadow: 0 10px 30px #00000026;
      }
      .top > b {
        font-size: 18px;
        font-weight: 760;
        letter-spacing: -0.025em;
        background: linear-gradient(100deg, #ffffff 12%, #dbeafe 52%, #a5b4fc);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 24px #818cf833;
      }
      .card {
        box-shadow: 0 8px 30px #0006;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: #4b5aa8;
      }
      .grid .card {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        background: linear-gradient(
          145deg,
          #151d4a 0%,
          #0e1430 55%,
          #0b1028 100%
        );
        border-color: #354178;
        box-shadow:
          0 14px 35px #0008,
          inset 0 1px 0 #ffffff14;
        transition:
          transform 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }
      .grid .card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          120deg,
          transparent 20%,
          #ffffff12 45%,
          transparent 70%
        );
        transform: translateX(-120%);
        transition: transform 0.7s ease;
      }
      .grid .card::after {
        content: "";
        position: absolute;
        top: 0;
        left: 18px;
        right: 18px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--cy), var(--pr));
        opacity: 0.8;
      }
      .grid .card:nth-child(2)::after {
        background: linear-gradient(90deg, #a78bfa, #f0abfc);
      }
      .grid .card:nth-child(3)::after {
        background: linear-gradient(90deg, #f0abfc, var(--cy));
      }
      .grid .card:hover {
        transform: translateY(-7px);
        border-color: #6675c7;
        box-shadow:
          0 20px 45px #000b,
          0 0 28px #4f46e533,
          inset 0 1px 0 #ffffff24;
      }
      .grid .card:hover::before {
        transform: translateX(120%);
      }
      .grid .card h3 {
        position: relative;
        letter-spacing: 0.01em;
      }
      .grid .card p {
        color: #d7ddf5;
      }
      .info-card {
        display: flex;
        flex-direction: column;
      }
      .info-card h3 {
        margin-bottom: 18px;
      }
      .info-list {
        counter-reset: info-item;
        display: grid;
        gap: 12px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .info-list li {
        counter-increment: info-item;
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 10px;
        align-items: start;
        color: #d7ddf5;
        line-height: 1.45;
        opacity: 0;
        transform: translateX(-8px);
        animation: infoItemIn 0.45s ease-out forwards;
      }
      .info-list li::before {
        content: counter(info-item, decimal-leading-zero);
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 1px solid #6b7bd4;
        border-radius: 9px;
        background: linear-gradient(135deg, #25336e, #151d4a);
        color: #a5f3fc;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        box-shadow: 0 5px 16px #0005;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          color 0.25s ease;
      }
      .info-list li:nth-child(2) {
        animation-delay: 0.08s;
      }
      .info-list li:nth-child(3) {
        animation-delay: 0.16s;
      }
      .info-list li:nth-child(4) {
        animation-delay: 0.24s;
      }
      .info-list li:nth-child(5) {
        animation-delay: 0.32s;
      }
      .info-list li:hover::before {
        transform: translateY(-2px) rotate(-6deg) scale(1.08);
        background: linear-gradient(135deg, var(--cy), var(--pr));
        color: #fff;
      }
      @keyframes infoItemIn {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .register-card {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 100% 0%, #4f46e533, transparent 35%),
          linear-gradient(145deg, #151d4a, #0b1028 72%);
        border-color: #465493;
        box-shadow:
          0 22px 55px #0009,
          inset 0 1px 0 #ffffff18;
        animation: registerIn 0.6s ease-out both;
      }
      .register-card h1 {
        font-size: clamp(32px, 5vw, 48px);
        background: linear-gradient(90deg, #fff, #a5f3fc, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .register-card .intro {
        color: #cbd5f5;
        max-width: 560px;
        margin: 0 0 18px;
      }
      .register-card form {
        animation: rise 0.7s 0.1s ease-out both;
      }
      .register-card input,
      .register-card select {
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
      }
      .register-card input:focus,
      .register-card select:focus {
        border-color: var(--cy);
        box-shadow:
          0 0 0 3px #22d3ee22,
          0 8px 20px #0004;
        transform: translateY(-1px);
      }
      .register-card .form-meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--mu);
        font-size: 12px;
        margin: 6px 0 14px;
      }
      .register-card .strength {
        height: 5px;
        background: #ffffff14;
        border-radius: 99px;
        overflow: hidden;
      }
      .register-card .strength i {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: var(--er);
        transition:
          width 0.25s,
          background 0.25s;
      }
      .register-card .submit-row {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .register-card .submit-row .btn {
        box-shadow: 0 10px 24px #4f46e566;
      }
      .register-card .privacy-note {
        color: var(--mu);
        font-size: 12px;
        margin: 0;
      }
      .login-card {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 100% 0%, #22d3ee22, transparent 38%),
          linear-gradient(145deg, #151d4a, #0b1028 72%);
        border-color: #465493;
        box-shadow:
          0 22px 55px #0009,
          inset 0 1px 0 #ffffff18;
        animation: registerIn 0.6s ease-out both;
      }
      .login-card h1 {
        font-size: clamp(32px, 5vw, 46px);
        background: linear-gradient(90deg, #fff, #a5f3fc, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .login-card .intro {
        color: #cbd5f5;
        margin: 0 0 22px;
      }
      .login-card form {
        animation: rise 0.7s 0.1s ease-out both;
      }
      .login-card input {
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
      }
      .login-card input:focus {
        border-color: var(--cy);
        box-shadow:
          0 0 0 3px #22d3ee22,
          0 8px 20px #0004;
        transform: translateY(-1px);
      }
      .login-card .password-wrap {
        position: relative;
      }
      .login-card .password-wrap input {
        padding-right: 82px;
      }
      .login-card .password-toggle {
        position: absolute;
        right: 6px;
        bottom: 5px;
        padding: 5px 8px;
        border: 0;
        background: transparent;
        color: var(--mu);
        font-size: 12px;
      }
      .login-card .password-toggle:hover {
        color: var(--cy);
        filter: none;
      }
      .login-card .login-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .login-card .login-actions .btn {
        box-shadow: 0 10px 24px #4f46e566;
      }
      .login-card .demo-action {
        background: linear-gradient(135deg, #123f62, #155e75);
        border-color: #22d3ee88;
        color: #cffafe;
        box-shadow: 0 8px 20px #0891b244;
      }
      .login-card .status-line {
        color: var(--mu);
        font-size: 12px;
        margin: 0;
      }
      .login-card .demo-box {
        margin-top: 18px;
        padding: 12px;
        border: 1px solid #22d3ee33;
        border-radius: 10px;
        background: #22d3ee0d;
        color: #cbd5f5;
        font-size: 13px;
      }
      @keyframes registerIn {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.99);
        }
      }
      button,
      .btn {
        transition:
          transform 0.15s,
          filter 0.15s,
          background 0.15s;
      }
      button:active {
        transform: scale(0.97);
      }
      button:hover:not(:disabled),
      .btn:hover {
        filter: brightness(1.2);
      }
      .p {
        background: linear-gradient(135deg, #6d5dfc, #4f46e5);
        box-shadow: 0 6px 20px #4f46e566;
      }
      .side button:hover {
        background: #ffffff12;
      }
      .hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(160deg, #0b1038, #1b1560);
        padding: 72px 20px;
      }
      .hero::before {
        content: "";
        position: absolute;
        width: 520px;
        height: 520px;
        left: 50%;
        top: -260px;
        margin-left: -260px;
        background: radial-gradient(circle, #22d3ee55, transparent 65%);
        animation: drift 12s ease-in-out infinite alternate;
      }
      .hero > * {
        position: relative;
      }
      .hero h1 {
        background: linear-gradient(90deg, #fff, #a5f3fc 60%, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .pg i {
        background: linear-gradient(90deg, var(--cy), #a78bfa);
        animation: grow 1.2s ease-out;
      }
      .bt i {
        background: linear-gradient(90deg, var(--pr), var(--cy));
        animation: grow 0.9s ease-out;
      }
      .bar:hover .bt {
        outline: 1px solid var(--cy);
      }
      .kpi b {
        font-variant-numeric: tabular-nums;
      }
      @keyframes grow {
        from {
          width: 0;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      @keyframes drift {
        to {
          transform: translateX(120px) scale(1.15);
        }
      }
      .main > *,
      .wrap > * {
        animation: rise 0.5s ease-out both;
      }
      .main > *:nth-child(3) {
        animation-delay: 0.06s;
      }
      .main > *:nth-child(4) {
        animation-delay: 0.12s;
      }
      .main > *:nth-child(5) {
        animation-delay: 0.18s;
      }
      .main > *:nth-child(n + 6) {
        animation-delay: 0.24s;
      }
      .msg {
        position: fixed;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        z-index: 50;
        max-width: min(380px, calc(100vw - 32px));
        box-shadow: 0 10px 40px #000a;
        animation: rise 0.3s;
      }
      .msg.ok {
        background: #1a2e0a;
        color: #d9f99d;
        border: 1px solid #3f6212;
      }
      .msg.er {
        background: #3b0d18;
        color: #fecdd3;
        border: 1px solid #9f1239;
      }
      footer.wrap {
        margin-top: 56px;
        padding-top: 28px;
        padding-bottom: 32px;
      }
      .public-home {
        padding-top: 56px;
        padding-bottom: 64px;
      }
      .public-home .grid {
        gap: 22px;
      }
      .public-home .grid .card {
        min-height: 100%;
      }
      .public-home .grid + .card {
        margin-top: 32px !important;
      }
      .public-home h2 {
        margin-top: 48px !important;
        margin-bottom: 20px;
      }
      .public-home details {
        margin: 0;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 14px;
        transition:
          background 0.25s ease,
          border-color 0.25s ease,
          transform 0.25s ease;
      }
      .public-home details p {
        max-width: 760px;
        margin: 0;
        padding: 0 18px 18px 46px;
        color: var(--mu);
      }
      .public-home details + details {
        margin-top: 8px;
      }
      .public-home details[open] {
        background: linear-gradient(110deg, #151d4a99, #0e143066);
        border-color: #3a4b91;
        transform: translateX(4px);
      }
      .public-home summary {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px;
        list-style: none;
        color: #e9edff;
        transition: color 0.2s ease;
      }
      .public-home summary::-webkit-details-marker {
        display: none;
      }
      .public-home summary::before {
        content: "+";
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 1px solid #5366bc;
        border-radius: 50%;
        color: var(--cy);
        font-size: 19px;
        font-weight: 400;
        line-height: 1;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          color 0.25s ease;
      }
      .public-home details[open] summary {
        color: #fff;
      }

etails stay in this browser for this local demo.</p></div></form></div></div>`,

              (/[A-Z]/.test(value) ? 1 : 0) +
              (/\d/.test(value) ? 1 : 0);
            bar.style.width = `${score * 25}%`;
            bar.style.background =
              score >= 4 ? "var(--ok)" : score >= 2 ? "var(--wn)" : "var(--er)";
          }
        }
      });
      document.addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target,
          d = Object.fromEntries(new FormData(f));
        try {
          await H[f.dataset.f](d, f);
        } catch (x) {
          flash("er", "Something went wrong: " + x.message);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && S.menu) {
          S.menu = false;
          render();
        }
      });
      document.addEventListener("click", (e) => {
        if (S.menu && !e.target.closest(".um")) {
          S.menu = false;
          render();
        }
      });
      (async () => {
        DB = ld();
        if (!DB || !DB.users) {
          DB = await seed();
          sv();
        }
        try {
          const s = JSON.parse(sessionStorage.getItem("nwsess"));
          if (s && DB.users.some((u) => u.id === s.id)) sess = s;
        } catch (e) {}
        if (sess)
          S.view =
            sess.role === "admin" ? "admin/dashboard" : "student/dashboard";
        if (!sess && new URLSearchParams(location.search).get("ref"))
          S.view = "register";
        render();
      })();
    </script>
  </body>
</html>
